# BN GAMEEX Production Nginx Reverse Proxy Configuration
events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Upstream Backends
    upstream api_backend {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web_frontend {
        server web:3000 max_fails=3 fail_timeout=10s;
    }

    upstream admin_frontend {
        server admin:80 max_fails=3 fail_timeout=10s;
    }

    # Public Web & API Gateway
    server {
        listen 80;
        server_name gameex.bookingnetwork.example api.bookingnetwork.example admin.bookingnetwork.example;

        # Security Headers (Article 31)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Healthcheck endpoint
        location /healthz {
            proxy_pass http://api_backend/healthz;
            proxy_set_header Host $host;
        }

        location /readyz {
            proxy_pass http://api_backend/readyz;
            proxy_set_header Host $host;
        }

        # REST API Routes
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Realtime WebSocket Chat Gateway (Article 14)
        location /api/v1/ws/ {
            proxy_pass http://api_backend/api/v1/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Admin Console Subpath / Host
        location /admin/ {
            proxy_pass http://admin_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Public Web Nuxt SSR (Default)
        location / {
            proxy_pass http://web_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

