version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bn-gameex-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - bn-frontend-net
      - bn-backend-net

  postgres:
    image: postgres:16-alpine
    container_name: bn-gameex-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bn_gameex}
      POSTGRES_USER: ${POSTGRES_USER:-gameex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password_2026}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ../../database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../../database/fixtures:/docker-entrypoint-initdb.d/fixtures
    networks:
      - bn-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameex_user} -d ${POSTGRES_DB:-bn_gameex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bn-gameex-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    volumes:
      - redisdata_prod:/data
    networks:
      - bn-backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: bn-gameex-api-prod
    restart: always
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-gameex_user}:${POSTGRES_PASSWORD:-secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-bn_gameex}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0"
      AUTO_MIGRATE: "true"
      MIGRATION_PATH: "database/migrations/001_initial_schema.sql"
      PSP_PROVIDER_ID: "${PSP_PROVIDER_ID:-stripe_sandbox}"
      PSP_WEBHOOK_SECRET: "${PSP_WEBHOOK_SECRET:-secret_webhook_key_v1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bn-backend-net
      - bn-frontend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: bn-gameex-worker-prod
    restart: always
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-gameex_user}:${POSTGRES_PASSWORD:-secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-bn_gameex}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bn-backend-net

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
    container_name: bn-gameex-admin-prod
    restart: always
    networks:
      - bn-frontend-net

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: bn-gameex-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      NITRO_PORT: "3000"
    networks:
      - bn-frontend-net

networks:
  bn-frontend-net:
    driver: bridge
  bn-backend-net:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:

