name: BN GAMEEX CI/CD Master Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Go Backend & Worker Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Backend Unit Tests & Invariant Verification
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Go API Server
        run: go build -v ./services/api/cmd

      - name: Build Go Worker
        run: go build -v ./services/worker/cmd

  admin-build:
    name: Admin Console Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/admin/package-lock.json'

      - name: Install Dependencies
        run: cd apps/admin && npm ci

      - name: Typecheck & Build
        run: cd apps/admin && npm run build

  mobile-analysis:
    name: Flutter Mobile Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Flutter Pub Get
        run: cd apps/mobile && flutter pub get

      - name: Flutter Analyze
        run: cd apps/mobile && flutter analyze

  compliance-and-security:
    name: Security & Policy Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Secret Leak Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Database Schema Integrity Check
        run: |
          echo "Verifying PostgreSQL Master Schema integrity..."
          grep -q "CHECK (available_quantity >= 0)" database/migrations/001_initial_schema.sql
          grep -q "uq_game_trade_policy" database/migrations/001_initial_schema.sql
          echo "Schema invariants verified."

